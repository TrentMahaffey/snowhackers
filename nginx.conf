upstream django {
    server snowdash:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Serve daily timelapse videos (24-hour)
    location /media/snowcams/ {
        alias /snowcam-timelapses/;

        # Enable range requests for video seeking
        add_header Accept-Ranges bytes;

        # Cache headers for videos
        expires 1d;
        add_header Cache-Control "public, immutable";

        # CORS headers if needed
        add_header Access-Control-Allow-Origin "*";

        # Security - only allow GET and HEAD
        limit_except GET HEAD {
            deny all;
        }

        # Disable autoindex
        autoindex off;
    }

    # Serve 7-day timelapse videos
    location /media/snowcams7/ {
        alias /snowcam-timelapses7/;

        add_header Accept-Ranges bytes;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        limit_except GET HEAD {
            deny all;
        }
        autoindex off;
    }

    # Serve 30-day timelapse videos
    location /media/snowcams30/ {
        alias /snowcam-timelapses30/;

        add_header Accept-Ranges bytes;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        limit_except GET HEAD {
            deny all;
        }
        autoindex off;
    }

    # Serve snapshot images directly
    location /media/snapshots/ {
        alias /snowcam-snapshots/;

        expires 1h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy all other requests to Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files
    location /static/ {
        alias /app/dashboard/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SEO files
    location /robots.txt {
        alias /app/dashboard/static/robots.txt;
    }
    location /sitemap.xml {
        alias /app/dashboard/static/sitemap.xml;
    }
}
