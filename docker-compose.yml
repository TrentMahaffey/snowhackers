version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snow}
      POSTGRES_USER: ${POSTGRES_USER:-snowuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  # Base image for running CLI / batch tasks
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowapi-pipeline:latest
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://snowuser:changeme@db:5432/snow
      TIMEZONE: America/Denver
      SNOTEL_STATES: CO,UT,WY,ID,MT,WA,OR,CA,NV,NM,AZ
      MODELS: gfs,icon,ecmwf
      FETCH_INTERVAL_SEC: 10800
      FORECAST_DAYS_AHEAD: 14
      AWDB_TIMEOUT_SEC: 45
      AWDB_RETRIES: 3
      AWDB_BACKOFF: 0.75
      AWDB_CHUNK_SIZE: 20
      VERBOSE: 0
    volumes:
      - ./:/app:delegated
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep","infinity"]
    restart: unless-stopped
    networks:
      - default

  # Ad-hoc commands extend from runner (use with profiles)
  stations:
    extends:
      service: runner
    command: ["python","-m","snowapi","stations"]
    profiles: ["adhoc"]
    networks:
      - default

  forecast_once:
    extends:
      service: runner
    command: ["python","-m","snowapi","forecast-once","--days-ahead","14"]
    profiles: ["adhoc"]
    networks:
      - default

  forecast_loop:
    extends:
      service: runner
    command: ["python","-m","snowapi","forecast-loop","--interval","3600","--days-ahead","14"]
    profiles: ["adhoc"]
    networks:
      - default

  init_views:
    extends:
      service: runner
    command: ["python","-m","snowapi","init-views"]
    profiles: ["adhoc"]
    networks:
      - default

  # Django site (Gunicorn) - internal only
  snowdash:
    build:
      context: ./snowdash
      dockerfile: Dockerfile
    image: snowdash:latest
    container_name: snowapi-snowdash
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-snow}
      POSTGRES_USER: ${POSTGRES_USER:-snowuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./snowdash:/app:delegated
      - ${SNOWCAM_TIMELAPSE_DIR:-./snowcam/timelapses}:/snowcam-timelapses:ro
      - ${SNOWCAM_TIMELAPSE7_DIR:-./snowcam/timelapses7}:/snowcam-timelapses7:ro
      - ${SNOWCAM_TIMELAPSE30_DIR:-./snowcam/timelapses30}:/snowcam-timelapses30:ro
      - ${SNOWCAM_OUT_DIR:-./snowcam/out}:/snowcam-snapshots:ro
      - ./cam_predictions.json:/snowcam-predictions/cam_predictions.json:ro
      - ./cam_predictions_history.json:/snowcam-predictions/cam_predictions_history.json:ro
    command:
      - bash
      - -lc
      - |
        python manage.py migrate &&
        exec gunicorn snowdash.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 4 \
          --timeout 60 \
          --worker-class sync \
          --max-requests 1000 \
          --max-requests-jitter 50
    restart: unless-stopped
    networks:
      - webnet     # to be reachable by your portfolio/nginx stack
      - default

  # Nginx reverse proxy - serves videos directly
  nginx:
    image: nginx:alpine
    container_name: snowapi-nginx
    ports:
      - "9003:80"   # host:container
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SNOWCAM_TIMELAPSE_DIR:-./snowcam/timelapses}:/snowcam-timelapses:ro
      - ${SNOWCAM_TIMELAPSE7_DIR:-./snowcam/timelapses7}:/snowcam-timelapses7:ro
      - ${SNOWCAM_TIMELAPSE30_DIR:-./snowcam/timelapses30}:/snowcam-timelapses30:ro
      - ${SNOWCAM_OUT_DIR:-./snowcam/out}:/snowcam-snapshots:ro
      - ./snowdash/dashboard/static:/app/dashboard/static:ro
    depends_on:
      - snowdash
    restart: unless-stopped
    networks:
      - webnet
      - default

volumes:
  pgdata:

networks:
  # Must already exist (created by your portfolio stack).
  # Check with: `docker network ls | grep webnet`
  webnet:
    external: true
    name: webnet