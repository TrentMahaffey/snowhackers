<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SNOTEL Forecast Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display:flex; gap:12px; align-items:center; }
    #map { height: calc(100vh - 54px); }
    select, label { font-size: 14px; }
    .legend { background:white; padding:8px; line-height:1.2; border:1px solid #ddd; border-radius:6px; }
    .legend i { width:12px; height:12px; float:left; margin-right:6px; opacity:0.9; display:inline-block; }
  </style>
</head>
<body>
  <header>
    <strong>SNOTEL Forecast Map</strong>
    <label>Window:
      <select id="hours">
        <option value="24">Next 24h</option>
        <option value="48">Next 48h</option>
        <option value="72" selected>Next 72h</option>
      </select>
    </label>
    <label>Metric:
      <select id="metric">
        <option value="avg_in" selected>Average (in)</option>
        <option value="max_in">Max (in)</option>
      </select>
    </label>
  </header>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map('map').setView([40.5, -111.5], 6); // center on central Rockies-ish; tweak as you like
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 15,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Color scale (inches)
    const breaks = [0, 2, 4, 8, 12, 18, 24, 36];
    const colors = ['#eaf7ff','#cfe9ff','#a9d1ff','#7fb6ff','#5199ff','#2c7ae0','#1f5fb3','#0d3f7a'];

    function getColor(x){
      for (let i = breaks.length - 1; i >= 0; i--) {
        if (x >= breaks[i]) return colors[i];
      }
      return colors[0];
    }

    const legend = L.control({position:'bottomright'});
    legend.onAdd = function(){
      const div = L.DomUtil.create('div','legend');
      div.innerHTML = '<strong>Forecast (in)</strong><br/>';
      for (let i=0; i<breaks.length; i++){
        const from = breaks[i];
        const to = breaks[i+1];
        div.innerHTML +=
          `<i style="background:${colors[i]}"></i> ${from}${to ? '&ndash;'+to : '+'}<br/>`;
      }
      return div;
    };
    legend.addTo(map);

    let layerGroup = L.layerGroup().addTo(map);

    async function loadData(){
      const h = document.getElementById('hours').value;
      const metric = document.getElementById('metric').value; // 'avg_in' or 'max_in'
      const res = await fetch(`/api/forecast_stations?h=${h}`);
      const rows = await res.json();

      layerGroup.clearLayers();
      rows.forEach(r => {
        const val = Number(r[metric] || 0);
        const marker = L.circleMarker([r.lat, r.lon], {
          radius: Math.max(4, Math.min(14, val/1.5)),
          color: '#222',
          weight: 0.8,
          fillColor: getColor(val),
          fillOpacity: 0.85
        }).bindPopup(`
          <strong>${r.station_name}</strong><br/>
          ${r.station_triplet}<br/>
          Window: ${h}h<br/>
          Avg: ${Number(r.avg_in || 0).toFixed(1)} in<br/>
          Max: ${Number(r.max_in || 0).toFixed(1)} in
        `);
        layerGroup.addLayer(marker);
      });

      // Auto-fit if we have at least a few
      const pts = rows.filter(r => r.lat != null && r.lon != null);
      if (pts.length > 2) {
        const bounds = L.latLngBounds(pts.map(p => [p.lat, p.lon]));
        map.fitBounds(bounds.pad(0.1));
      }
    }

    document.getElementById('hours').addEventListener('change', loadData);
    document.getElementById('metric').addEventListener('change', loadData);

    loadData();
  </script>
</body>
</html>
