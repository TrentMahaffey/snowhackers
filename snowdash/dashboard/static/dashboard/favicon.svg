<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="snow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#snow)"/>
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <!-- Main vertical line -->
    <line x1="50" y1="15" x2="50" y2="85"/>
    <!-- Main horizontal line -->
    <line x1="15" y1="50" x2="85" y2="50"/>
    <!-- Diagonal lines -->
    <line x1="25" y1="25" x2="75" y2="75"/>
    <line x1="75" y1="25" x2="25" y2="75"/>
    <!-- Small branches -->
    <line x1="50" y1="25" x2="40" y2="35"/>
    <line x1="50" y1="25" x2="60" y2="35"/>
    <line x1="50" y1="75" x2="40" y2="65"/>
    <line x1="50" y1="75" x2="60" y2="65"/>
    <line x1="25" y1="50" x2="35" y2="40"/>
    <line x1="25" y1="50" x2="35" y2="60"/>
    <line x1="75" y1="50" x2="65" y2="40"/>
    <line x1="75" y1="50" x2="65" y2="60"/>
  </g>
</svg>
