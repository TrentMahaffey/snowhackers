[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowapi"
version = "0.1.0"
description = "SNOTEL + Open-Meteo snowfall fetcher (obs + forecast) with Postgres storage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Your Name", email="you@example.com"}]
dependencies = [
  "requests>=2.31",
  "python-dateutil>=2.8.2",
  "psycopg[binary]>=3.1",
]

[project.scripts]
snowapi = "snowapi.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["snowapi"]