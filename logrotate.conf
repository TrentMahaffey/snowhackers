# User-level logrotate for the snowhackers cron logs (run by bin/rotate_logs.sh, weekly).
# copytruncate: cron jobs append with >>, so the file must stay in place.
/home/trent/snowhackers/logs/cron_runner.log
/home/trent/snowhackers/logs/cam_predictions.log
/home/trent/snowhackers/logs/resort_reports.log
/home/trent/snowhackers/logs/forecast.log
/home/trent/snowhackers/logs/highlights.log
/home/trent/snowhackers/logs/score_forecasts.log
/home/trent/snowhackers/logs/backfill.log
{
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
